# Selection file: every node at the full profile, with macOS defaults
# applied and essentialDots' Pipxfile applications installed. Replaces the
# old install-everything.sh fixed-choice wrapper.
profile: full
nodes:
  - id: essentialDots
    options:
      macos-defaults: true
      pipx: true
  - id: toolsDots.devTools.iTerm
  - id: toolsDots.devTools.nvim
  - id: toolsDots.devTools.vsCode
  - id: toolsDots.devTools.tmux
  - id: toolsDots.devTools.superfile
  - id: toolsDots.aiTools.aiApps
  - id: toolsDots.aiTools.localLLM
  - id: toolsDots.aiTools.opencode
