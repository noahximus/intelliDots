[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-wrapper"
version = "0.3.0"
description = "OpenAI-compatible proxy that validates and repairs local-model tool calls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
local-llm-wrapper = "local_llm_wrapper.cli:main"

[tool.setuptools.packages.find]
include = ["local_llm_wrapper*"]
