# Master node registry for intelliDots: every installable component's path,
# default options, and (for the AI components) Neovim integration metadata.
#
# This file is not read for selection by itself -- install.sh takes a
# selection file via --file (features-default.yaml if omitted) that lists
# which node ids to actually install. features-default.yaml, -essential.yaml,
# and -all.yaml cover the common cases; write your own for anything else.
#
# `options` here are each node's default boolean flags, forwarded to that
# node's own install.sh as `--<key>` whenever the effective value is `true`.
# A selection file's own per-node `options` (if given) override these
# key-by-key; anything it doesn't mention falls back to what's defined here.
# A matching root install.sh flag (--macos-defaults, --pipx,
# --with-turbo-fieldfare) still forces that option on for a single run on
# top of both.
#
# `nvim_integration` is descriptive only (used by status.sh) -- the actual
# trigger mechanism is a filesystem convention: the aiTools component stows
# an integration file to a well-known path under ~/.local/share, and the
# corresponding nvim plugin spec loads it if present at Neovim startup.
# Install order between the two components never matters, and installing
# either one without nvim is always safe (the stowed file just sits
# unused).
#
# `extensions` (vsCode) and `extras` (nvim) are plain lists read directly by
# that node's own install.sh -- comment out (or delete) a line to opt out of
# installing that one item; nothing else to edit.
nodes:
  - id: essentialDots
    path: essentialDots
    options:
      macos-defaults: false
      pipx: false

  - id: toolsDots.devTools.iTerm
    path: toolsDots/devTools/iTerm

  - id: toolsDots.devTools.nvim
    path: toolsDots/devTools/nvim
    extras:
      # @agentclientprotocol/codex-acp via npm; lets CodeCompanion use
      # online Codex (ChatGPT auth). Comment out to skip.
      - codex-acp

  - id: toolsDots.devTools.vsCode
    path: toolsDots/devTools/vsCode
    extensions:
      - ms-python.python # Python language support, debugging, and environment management.
      - ms-python.vscode-pylance # Fast Python IntelliSense, type checking, and auto-imports.
      - eamodio.gitlens # Inline git blame, history, and repository insights.
      - vscodevim.vim # Vim modal-editing keybindings, matching nvim's Neovim workflow.
      - esbenp.prettier-vscode # Opinionated code formatter for JS/TS/JSON/CSS/Markdown.
      - dbaeumer.vscode-eslint # ESLint integration for JS/TS linting.
      - anthropic.claude-code # Official Claude Code IDE integration (sidebar, inline diffs).
      - openai.chatgpt # Official Codex coding agent IDE integration.
      - Continue.continue # Open-source AI code agent; connects to local LLM backends (llama.cpp/Ollama-compatible) from localLLM.

  - id: toolsDots.devTools.tmux
    path: toolsDots/devTools/tmux

  - id: toolsDots.devTools.superfile
    path: toolsDots/devTools/superfile

  - id: toolsDots.aiTools.aiApps
    path: toolsDots/aiTools/aiApps

  - id: toolsDots.aiTools.localLLM
    path: toolsDots/aiTools/localLLM
    options:
      # llama.cpp-based local model runtime. On by default when this node
      # is selected at all, matching myAILab's old delegation policy.
      with-local-llm: true
      # Swift/Metal Gemma runtime. Opt-in: large (~14GB model) and needs
      # macOS 26 + Xcode 26 + Apple Silicon.
      with-turbo-fieldfare: false
    nvim_integration: codecompanion
    nvim_integration_path: "~/.local/share/local-llm/integrations/codecompanion.lua"

  - id: toolsDots.aiTools.opencode
    path: toolsDots/aiTools/opencode
    nvim_integration: opencode
    nvim_integration_path: "~/.local/share/opencode/integrations/nvim-toggleterm.lua"
